[project]
name = "rfp-ai-automation"
version = "0.1.0"
description = "أتمتة إعداد طلبات العروض (RFP) وتقييم عروض المورّدين بسير عمل قابل للتتبّع"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
pdf = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
rfp-automation = "rfp_automation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
